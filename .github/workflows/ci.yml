name: CI

# No run on push to master: the merge queue already tested the exact merged
# commit, and a third run only held machines other changes were waiting on.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

# A newer push to the same pull request replaces the older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The full set. It guards master: every merge queue run (and any other
  # event) runs all eight shards. Pull requests get the quick job instead.
  unit:
    name: unit (${{ matrix.shard }}/8)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      - name: Unit tests
        # Assigns expensive files first using measured GitHub run times.
        # commands.test.js remains split by test/helpers/test-part.js.
        env:
          ATRIS_TEST_SPLIT: '1'
        run: node scripts/ci-test-shard.js ${{ matrix.shard }}/8

  # The per change check on a pull request: the quick list plus every test
  # file the pull request adds or edits. The merge queue runs the full set.
  quick:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # The pull request merge commit and its first parent, the base.
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      - name: Quick tests and the tests this pull request touches
        run: |
          git rev-parse --verify --quiet 'HEAD^2' > /dev/null || {
            echo 'expected the pull request merge commit; nothing to compare with.'
            exit 1
          }
          node scripts/ci-quick-check.js 'HEAD^1'

  decks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      - name: Lint shipped deck specs
        run: npm run lint:decks

  # The required check. A skipped or cancelled job can never count as green:
  # on a pull request it needs the quick job and the deck lint to pass. In
  # the merge queue it needs every shard and the deck lint to pass.
  test:
    if: always()
    needs: [unit, quick, decks]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          test "${{ needs.decks.result }}" = success
          if [ "${{ github.event_name }}" = pull_request ]; then
            test "${{ needs.quick.result }}" = success
          else
            test "${{ needs.unit.result }}" = success
          fi
