name: CI

on:
  pull_request:
  merge_group:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      base: ${{ steps.pick.outputs.base }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Enough history to compare stacked groups. A missing ancestor
          # selects the full suite instead of an incomplete change list.
          fetch-depth: 32

      - name: Read the merge queue target
        id: target
        if: github.event_name == 'merge_group'
        continue-on-error: true
        env:
          TARGET_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          case "$TARGET_REF" in refs/heads/*) ;; *) exit 1 ;; esac
          git check-ref-format "$TARGET_REF"
          git fetch --no-tags --depth=32 origin "+$TARGET_REF:refs/remotes/origin/${TARGET_REF#refs/heads/}"

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Select affected tests
        id: pick
        env:
          TARGET_READ: ${{ steps.target.outcome }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "mode=quick" >> "$GITHUB_OUTPUT"
            echo "base=HEAD^1" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[{"group":"1/3","files":[]},{"group":"2/3","files":[]},{"group":"3/3","files":[]}]}' >> "$GITHUB_OUTPUT"
          else
            node scripts/ci-test-plan.js
          fi

  unit:
    needs: plan
    name: unit (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      - name: Run selected tests
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          BASE: ${{ needs.plan.outputs.base }}
          GROUP: ${{ matrix.group }}
          FILES: ${{ toJSON(matrix.files) }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            case "$GROUP" in
              2/3) variants="on off off on" ;;
              *) variants="off on on off" ;;
            esac
            for variant in $variants; do
              unset NODE_COMPILE_CACHE
              if [ "$variant" = on ]; then
                export NODE_COMPILE_CACHE="$(mktemp -d "$RUNNER_TEMP/atris-compile.XXXXXX")"
              fi
              /usr/bin/time -f "cache-timing $GROUP $variant %e" node scripts/ci-quick-check.js "$BASE" "$GROUP"
            done
            exit 0
          fi
          case "$MODE" in
            selected) node -e 'process.exitCode = require("./scripts/ci-impact-check").runFiles(JSON.parse(process.env.FILES), process.cwd())' ;;
            quick) node scripts/ci-quick-check.js "$BASE" "$GROUP" ;;
            full) ATRIS_TEST_SPLIT=1 node scripts/ci-test-shard.js "$GROUP" ;;
            *) exit 1 ;;
          esac

  decks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      - name: Lint shipped deck specs
        run: npm run lint:decks

  # GitHub requires this check on both pull requests and the combined commit.
  test:
    if: always()
    needs: [plan, unit, decks]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        env:
          PLAN: ${{ needs.plan.result }}
          UNIT: ${{ needs.unit.result }}
          DECKS: ${{ needs.decks.result }}
        run: |
          test "$PLAN" = success
          test "$UNIT" = success
          test "$DECKS" = success
