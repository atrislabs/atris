name: CI

on:
  pull_request:
  merge_group:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      base: ${{ steps.pick.outputs.base }}
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Enough history to compare stacked groups. A missing ancestor
          # selects the full suite instead of an incomplete change list.
          fetch-depth: 32

      - name: Read the merge queue target
        id: target
        if: github.event_name == 'merge_group'
        continue-on-error: true
        env:
          TARGET_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          case "$TARGET_REF" in refs/heads/*) ;; *) exit 1 ;; esac
          git check-ref-format "$TARGET_REF"
          git fetch --no-tags --depth=32 origin "+$TARGET_REF:refs/remotes/origin/${TARGET_REF#refs/heads/}"

      - name: Check preinstalled Node
        id: node
        run: |
          if command -v node >/dev/null 2>&1; then
            node --version
            if [ "$(node -p 'process.versions.node.split(".")[0]')" = 24 ]; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-node@v6
        if: steps.node.outputs.ready != 'true'
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Select affected tests
        id: pick
        env:
          TARGET_READ: ${{ steps.target.outcome }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "mode=layout-leak-trial" >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[{"group":"6/8","pair":1},{"group":"6/8","pair":2},{"group":"6/8","pair":3},{"group":"6/8","pair":4}]}' >> "$GITHUB_OUTPUT"
          else
            node scripts/ci-test-plan.js
          fi

  unit:
    needs: plan
    name: unit (${{ matrix.group }}) ${{ matrix.pair }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 3

      - name: Check preinstalled Node
        id: node
        run: |
          if command -v node >/dev/null 2>&1; then
            node --version
            if [ "$(node -p 'process.versions.node.split(".")[0]')" = 24 ]; then
              echo 'ready=true' >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-node@v6
        if: steps.node.outputs.ready != 'true'
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Run selected tests
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          BASE: ${{ needs.plan.outputs.base }}
          GROUP: ${{ matrix.group }}
          LEAK_PAIR: ${{ matrix.pair }}
          FILES: ${{ toJSON(matrix.files) }}
        run: |
          case "$MODE" in
            layout-leak-trial)
              control=$(git rev-parse HEAD~2)
              candidate=$(git rev-parse HEAD~1)
              git diff --name-only "$control" "$candidate"
              google-chrome --version
              case "$LEAK_PAIR" in
                1|3) variants="control candidate candidate control" ;;
                2|4) variants="candidate control control candidate" ;;
                *) exit 1 ;;
              esac
              status=0
              for variant in $variants; do
                case "$variant" in control) ref=$control ;; candidate) ref=$candidate ;; esac
                git switch --detach "$ref"
                echo "leak-trial-start $LEAK_PAIR $variant $ref"
                result=0
                ATRIS_TEST_SPLIT=1 node scripts/ci-test-shard.js "$GROUP" || result=$?
                echo "leak-trial-result $LEAK_PAIR $variant $result"
                if [ "$result" -ne 0 ]; then status=1; fi
              done
              exit "$status"
              ;;
            selected) node -e 'process.exitCode = require("./scripts/ci-impact-check").runFiles(JSON.parse(process.env.FILES), process.cwd())' ;;
            quick)
              if [ -z "${NODE_V8_COVERAGE:-}" ] && [ -z "${NODE_COMPILE_CACHE:-}" ]; then
                export NODE_COMPILE_CACHE="$RUNNER_TEMP/atris-node-compile-cache"
              fi
              node scripts/ci-quick-check.js "$BASE" "$GROUP"
              ;;
            full) ATRIS_TEST_SPLIT=1 node scripts/ci-test-shard.js "$GROUP" ;;
            *) exit 1 ;;
          esac

  decks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - run: npm ci

      - name: Lint shipped deck specs
        run: npm run lint:decks

  # GitHub requires this check on both pull requests and the combined commit.
  test:
    if: always()
    needs: [plan, unit, decks]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        env:
          PLAN: ${{ needs.plan.result }}
          UNIT: ${{ needs.unit.result }}
          DECKS: ${{ needs.decks.result }}
        run: |
          test "$PLAN" = success
          test "$UNIT" = success
          test "$DECKS" = success
