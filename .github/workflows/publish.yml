name: Publish atris

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - run: npm ci

      - run: npm run build --if-present

      - run: npm test

      - name: Block duplicate npm versions
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "atris@$VERSION" version >/tmp/atris-published-version 2>/dev/null; then
            echo "atris@$VERSION is already published"
            exit 1
          fi

      - run: npm run publish:release
