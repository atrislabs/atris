name: Publish atris

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # a publish takes about 2 minutes, then reads the exact version back for
    # 2 more. npm accepting the package is the finish line; showing it can take
    # an hour (3.83.3 and 3.83.4 took 55 minutes), so that wait lives below.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use npm with trusted publishing support
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm ci

      - run: npm run build --if-present

      - name: Release gate
        # Focused subset deliberately replaced the full "npm test" gate in
        # be0c484a: the full suite has known-flaky subprocess tests locally.
        # Run the full suite (marker-free env) before pushing a v* tag.
        env:
          # _start was removed on purpose in #690 (leftover _start no longer
          # spawns runners). Any other command removal still blocks publish.
          ATRIS_ALLOW_COMMAND_REMOVALS: "_start"
        run: |
          node -c commands/mission.js
          node --test test/mission-status.test.js test/check-command-regression.test.js test/repo-shape.test.js
          node scripts/check-command-regression.js
          npm run publish:release -- --dry-run

      - name: Restore clean release tree
        run: |
          git reset --hard
          git clean -fd

      - name: Block duplicate npm versions
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "atris@$VERSION" version >/tmp/atris-published-version 2>/dev/null; then
            echo "atris@$VERSION is already published"
            exit 1
          fi

      - name: Publish with npm trusted publishing
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true
          npm run publish:release

  mcp-registry:
    # The MCP registry reads mcpName from the npm package, so it needs npm to
    # show this exact version first. This job waits for that on its own and
    # never turns a shipped npm release red.
    needs: publish
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Wait for npm to show this exact version
        run: node scripts/npm-publish-readback.js wait "$(node -p "require('./package.json').version")" --minutes 90

      - name: List this version in the official MCP registry
        # Version in server.json follows package.json.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          curl -sSfL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
