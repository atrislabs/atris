name: Publish atris

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Use npm with trusted publishing support
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: npm ci

      - run: npm run build --if-present

      - name: Release gate
        run: |
          node -c commands/mission.js
          node --test test/mission-status.test.js test/check-command-regression.test.js test/repo-shape.test.js
          node scripts/check-command-regression.js
          npm run publish:release -- --dry-run

      - name: Restore clean release tree
        run: |
          git reset --hard
          git clean -fd

      - name: Block duplicate npm versions
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "atris@$VERSION" version >/tmp/atris-published-version 2>/dev/null; then
            echo "atris@$VERSION is already published"
            exit 1
          fi

      - name: Publish with npm trusted publishing
        run: |
          npm config delete //registry.npmjs.org/:_authToken || true
          npm run publish:release
